services:
  redis:
    image: redis:7-alpine
    container_name: job-monitor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  job-api:
    build:
      context: ./job-api
      dockerfile: Dockerfile
    container_name: job-monitor-api
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL:-devsanjaikumarv@gmail.com}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-devsanjaikumarv@gmail.com}
      - SMTP_PASS=${SMTP_PASS:-vsvwqrhhbmdwlzfv}
      - SMTP_FROM=${SMTP_FROM:-devsanjaikumarv@gmail.com}
      - PUSH_PROVIDER=${PUSH_PROVIDER:-mock}
      - FCM_PROJECT_ID=${FCM_PROJECT_ID:-push-notification-servic-ddb26}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - ./job-api/storage:/app/storage
      - ./monitored-folders:/monitored-folders
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  job-ui:
    build:
      context: ./job-ui
      dockerfile: Dockerfile
    container_name: job-monitor-ui
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    depends_on:
      - job-api
    restart: unless-stopped

volumes:
  redis-data:
